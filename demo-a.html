<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo A: Modern Tech / Glassmorphism</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
    
    body {
      margin: 0; padding: 50px;
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #1a0033, #000000 70%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Ambient Glows */
    body::before {
      content: ''; position: absolute; top: 10%; left: 20%; width: 300px; height: 300px;
      background: #00f0ff; filter: blur(150px); opacity: 0.3; z-index: -1;
    }
    body::after {
      content: ''; position: absolute; bottom: 10%; right: 20%; width: 400px; height: 400px;
      background: #ff007a; filter: blur(150px); opacity: 0.2; z-index: -1;
    }

    .hero { text-align: center; margin-bottom: 60px; }
    h1 { font-size: 3.5rem; font-weight: 800; margin: 0; background: linear-gradient(90deg, #00f0ff, #ff007a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #a0a0b0; font-size: 1.2rem; max-width: 500px; margin: 15px auto; }

    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      width: 320px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 40px rgba(0, 240, 255, 0.2);
    }
    .card-icon { font-size: 2.5rem; margin-bottom: 15px; }
    .card-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; }
    .card-desc { color: #a0a0b0; font-size: 0.95rem; line-height: 1.5; }
    .btn { 
      background: linear-gradient(90deg, #00f0ff, #0057ff); 
      color: white; border: none; padding: 12px 24px; border-radius: 12px; 
      font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 20px;
      transition: opacity 0.3s;
    }
    .btn:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>AllTools 2.0</h1>
    <p>The sleek, high-tech, futuristic Glassmorphism design.</p>
    <button class="btn">Try it out</button>
  </div>
  
  <div class="card">
    <div class="card-icon">⚡</div>
    <div class="card-title">PDF Studio</div>
    <div class="card-desc">Merge and split PDF files instantly in your browser with zero server uploads.</div>
  </div>
</body>
</html>
