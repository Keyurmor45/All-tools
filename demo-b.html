<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo B: Neobrutalism</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap');
    
    body {
      margin: 0; padding: 50px;
      font-family: 'Space Grotesk', sans-serif;
      background: #fbf5e6;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(#000 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .hero { text-align: center; margin-bottom: 60px; }
    h1 { font-size: 4rem; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -2px; }
    p { font-size: 1.3rem; font-weight: 700; max-width: 500px; margin: 15px auto; border-bottom: 4px solid #000; display: inline-block; }

    .card {
      background: #ff90e8;
      border: 4px solid #000;
      border-radius: 12px;
      padding: 30px;
      width: 320px;
      box-shadow: 8px 8px 0px #000;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 12px 12px 0px #000;
      background: #fff000;
    }
    .card:active {
      transform: translate(4px, 4px);
      box-shadow: 4px 4px 0px #000;
    }
    .card-icon { font-size: 3rem; margin-bottom: 10px; }
    .card-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; border-bottom: 3px solid #000; display: inline-block; }
    .card-desc { font-weight: 700; font-size: 1.05rem; line-height: 1.4; }
    
    .btn { 
      background: #23a094; 
      color: #000; border: 4px solid #000; padding: 15px 30px; border-radius: 8px; 
      font-weight: 900; font-size: 1.2rem; cursor: pointer; margin-top: 20px;
      box-shadow: 6px 6px 0px #000;
      transition: all 0.1s ease;
      text-transform: uppercase;
    }
    .btn:active {
      transform: translate(6px, 6px);
      box-shadow: 0px 0px 0px #000;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>AllTools 2.0</h1>
    <p>The punchy, playful Neobrutalism design.</p>
    <br>
    <button class="btn">Try it out</button>
  </div>
  
  <div class="card">
    <div class="card-icon">⚡</div>
    <div class="card-title">PDF Studio</div>
    <div class="card-desc">Merge and split PDF files instantly in your browser with zero server uploads.</div>
  </div>
</body>
</html>
