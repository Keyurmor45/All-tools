<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo C: Ultra-Clean SaaS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0; padding: 50px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .hero { text-align: center; margin-bottom: 60px; }
    h1 { font-size: 3.5rem; font-weight: 700; margin: 0; letter-spacing: -1px; }
    p { font-size: 1.3rem; font-weight: 400; color: #86868b; max-width: 500px; margin: 15px auto; line-height: 1.4; }

    .card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 20px;
      padding: 35px;
      width: 320px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-5px) scale(1.01);
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }
    .card-icon { font-size: 2.5rem; margin-bottom: 20px; background: #e8f0fe; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; border-radius: 16px; }
    .card-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 10px; color: #1d1d1f; }
    .card-desc { font-weight: 400; font-size: 1.05rem; line-height: 1.5; color: #86868b; }
    
    .btn { 
      background: #0071e3; 
      color: #fff; border: none; padding: 14px 28px; border-radius: 980px; 
      font-weight: 500; font-size: 1.1rem; cursor: pointer; margin-top: 25px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0077ed; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>AllTools 2.0</h1>
    <p>The ultra-clean, professional Apple SaaS design.</p>
    <button class="btn">Try it out</button>
  </div>
  
  <div class="card">
    <div class="card-icon">⚡</div>
    <div class="card-title">PDF Studio</div>
    <div class="card-desc">Merge and split PDF files instantly in your browser with zero server uploads.</div>
  </div>
</body>
</html>
