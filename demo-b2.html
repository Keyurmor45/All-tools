<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo B2: Extreme Neobrutalism</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Bebas+Neue&display=swap');
    
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      background-color: #ffd6ff;
      background-image: linear-gradient(#000 2px, transparent 2px), linear-gradient(90deg, #000 2px, transparent 2px);
      background-size: 50px 50px;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* Navbar */
    .nav {
      width: 100%;
      background: #00f5d4;
      border-bottom: 6px solid #000;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 0 #000;
      margin-bottom: 80px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-family: 'Bebas Neue', cursive; font-size: 3rem; margin: 0; line-height: 1; letter-spacing: 2px; }
    
    .search {
      background: #fff;
      border: 4px solid #000;
      padding: 10px 20px;
      font-size: 1.2rem;
      font-weight: 900;
      width: 300px;
      box-shadow: 6px 6px 0 #000;
    }

    /* Hero */
    .hero { text-align: center; margin-bottom: 60px; background: #fff; padding: 40px; border: 6px solid #000; box-shadow: 15px 15px 0 #000; transform: rotate(-2deg); }
    h1 { font-family: 'Bebas Neue', cursive; font-size: 6rem; margin: 0; line-height: 0.9; letter-spacing: 4px; color: #ff0a54; text-shadow: 4px 4px 0 #000; }
    p { font-size: 1.4rem; font-weight: 900; margin: 15px auto 0; background: #000; color: #fff; padding: 5px 15px; display: inline-block; }

    /* Categories */
    .categories { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
    .cat-pill {
      background: #fcf6bd;
      border: 4px solid #000;
      padding: 10px 20px;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.1s;
    }
    .cat-pill.active { background: #ff99c8; transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
    .cat-pill:hover:not(.active) { background: #d0f4de; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }

    /* Grid */
    .grid { display: flex; gap: 30px; }

    /* Card */
    .card {
      background: #a9def9;
      border: 6px solid #000;
      padding: 25px;
      width: 320px;
      box-shadow: 12px 12px 0px #000;
      transition: all 0.1s ease;
      cursor: pointer;
      position: relative;
    }
    .card::before {
      content: 'NEW';
      position: absolute;
      top: -15px;
      right: -15px;
      background: #ff0a54;
      color: #fff;
      font-weight: 900;
      padding: 5px 10px;
      border: 3px solid #000;
      transform: rotate(10deg);
    }
    .card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 16px 16px 0px #000;
      background: #e4c1f9;
    }
    .card:active {
      transform: translate(12px, 12px);
      box-shadow: 0px 0px 0px #000;
    }
    .card-icon { font-size: 4rem; margin-bottom: 10px; text-align: center; }
    .card-title { font-size: 2rem; font-weight: 900; margin-bottom: 10px; text-align: center; background: #000; color: #fff; padding: 5px; }
    .card-desc { font-weight: 700; font-size: 1.1rem; line-height: 1.4; border-top: 4px solid #000; padding-top: 15px; margin-top: 15px;}
    
  </style>
</head>
<body>
  
  <nav class="nav">
    <div class="logo">ALLTOOLS⚡</div>
    <input type="text" class="search" placeholder="SEARCH TOOLS...">
  </nav>

  <div class="hero">
    <h1>STOP GOOGLING.</h1>
    <p>512+ Brutalist Web Tools.</p>
  </div>

  <div class="categories">
    <div class="cat-pill active">🛠️ All Tools</div>
    <div class="cat-pill">🤖 AI Tools</div>
    <div class="cat-pill">📝 Text Tools</div>
    <div class="cat-pill">🎨 Color & Design</div>
  </div>
  
  <div class="grid">
    <div class="card">
      <div class="card-icon">📚</div>
      <div class="card-title">PDF MERGER</div>
      <div class="card-desc">Combine multiple PDF files into a single document entirely in your browser.</div>
    </div>
    <div class="card" style="background:#ff99c8;">
      <div class="card-icon">🤖</div>
      <div class="card-title">AI WRITER</div>
      <div class="card-desc">Rewrite emails to sound Professional, Casual, or Persuasive instantly.</div>
    </div>
  </div>

</body>
</html>
